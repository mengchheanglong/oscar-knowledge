[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "oscar-knowledge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic-settings==2.9.1",
  "SQLAlchemy==2.0.40", "psycopg[binary]==3.2.9", "pgvector==0.4.1",
  "alembic==1.15.2", "typer==0.15.3", "httpx==0.28.1", "PyYAML==6.0.2",
  "PyMuPDF==1.25.5", "python-docx==1.1.2", "beautifulsoup4==4.13.4",
  "openpyxl==3.1.5",
  "click==8.1.8",
]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.8", "mypy==1.15.0", "types-PyYAML==6.0.12.20250402"]
[project.scripts]
knowledgectl = "app.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires isolated PostgreSQL test database"]
[tool.ruff]
line-length = 100
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
