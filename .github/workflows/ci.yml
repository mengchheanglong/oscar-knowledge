name: Knowledge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_USER: knowledge_test
          POSTGRES_PASSWORD: local_knowledge_test_only
          POSTGRES_DB: knowledge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U knowledge_test -d knowledge_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      NO_COLOR: "1"
      KNOWLEDGE_TEST_DATABASE_URL: postgresql+psycopg://knowledge_test:local_knowledge_test_only@127.0.0.1:5432/knowledge_test
      KNOWLEDGE_DATABASE_URL: postgresql+psycopg://knowledge_test:local_knowledge_test_only@127.0.0.1:5432/knowledge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check app tests scripts migrations
      - name: Ruff format check
        run: ruff format --check app tests scripts migrations
      - name: Mypy typecheck
        run: mypy app
      - name: Database migrations
        run: alembic upgrade head
      - name: Run test suite
        run: pytest -v
